{{- $src := .Get "src" -}}
{{- if not $src -}}
  {{- errorf "image shortcode: missing src (%s)" .Position -}}
{{- end -}}
<img
  src="{{ $src }}"
  {{- with .Get "alt" }} alt="{{ . }}"{{ end }}
  {{- with .Get "class" }} class="{{ . }}"{{ end }}
  {{- with .Get "width" }} width="{{ . }}"{{ end }}
  {{- with .Get "height" }} height="{{ . }}"{{ end }}
  {{- with .Get "title" }} title="{{ . }}"{{ end }}
  loading="{{ .Get "loading" | default "lazy" }}"
  decoding="async"
/>
