baseURL: "https://corb.co/"
locale: "en-US"
title: "corb.co"
theme: "PaperMod"

pagination:
  pagerSize: 5

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

menu:
  main:
    - name: About
      url: about/
      weight: 10
    - name: Posts
      url: posts/
      weight: 20
    - name: ""
      title: Search
      identifier: search
      url: search/
      weight: 30
      pre: >-
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        role="img" aria-label="Search"><circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

enableRobotsTXT: false
# buildDrafts: false
# buildFuture: false
# buildExpired: false

params:
  title: corb.co
  description: "Personal and projects site for Corban Mailloux"
  author: Corban Mailloux

  images:
    - /images/og-default.jpg

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  comments: false
  disableScrollToTop: true
  hideFooter: true

  defaultTheme: auto
  disableThemeToggle: false

  assets:
    # disableFingerprinting: true
    favicon: "/icons/favicon.ico"
    favicon16x16: "/icons/favicon-16x16.png"
    favicon32x32: "/icons/favicon-32x32.png"
    apple_touch_icon: "/icons/apple-touch-icon.png"
    safari_pinned_tab: "/icons/safari-pinned-tab.svg"

  label:
    # text: "corb.co"
    icon: /icons/logo.min.svg
    iconHeight: 38

  # profile-mode
  profileMode:
    enabled: true
    title: 👋🏼 Hey! I'm Corban.
    subtitle: |
      🍼 Dad

      💻 Engineer

      💡 [Home Automator](https://github.com/corbanmailloux/home-assistant-configuration)

      🎷 [Musician](https://wellsuitedband.com)

      🎮 FPV Drone Pilot

      🐈 [Amateur Cat Trainer](https://www.instagram.com/theladies_sashaandmaya/)

      ✅ Hobby Collector
    imageUrl: "/images/corban-mailloux.webp"
    imageWidth: 300
    imageHeight: 300
    imageTitle: Headshot of Corban Mailloux
    buttons:
      - name: Posts
        url: posts/

  socialIcons:
    - name: email
      url: mailto:web@corb.co
    - name: github
      url: "https://github.com/corbanmailloux"
    - name: instagram
      url: "https://www.instagram.com/corbanmailloux/"
    - name: linkedin
      url: "https://www.linkedin.com/in/corbanmailloux"

  schema:
    publisherType: Person
    sameAs:
      - "https://github.com/corbanmailloux"
      - "https://www.instagram.com/corbanmailloux/"
      - "https://www.linkedin.com/in/corbanmailloux"

  cover:
    hidden: false # covers are used as post list thumbnails
    responsiveImages: true
    hiddenInList: false # show post cover images on list pages
    hiddenInSingle: true # avoid repeating the cover above the post body

  # Post Search Configuration
  # https://www.fusejs.io/fuzzy-search.html#controlling-fuzziness

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 100
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    renderer:
      unsafe: true
